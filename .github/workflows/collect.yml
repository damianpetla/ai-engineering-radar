name: Collect verified evidence
on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:
    inputs:
      backfill:
        description: "Traverse bounded historical publisher archives (up to 180 days)"
        type: boolean
        default: false
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: evidence-collection
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Collect verified originals
        env:
          RADAR_BACKFILL: ${{ inputs.backfill }}
        run: |
          if [ "$RADAR_BACKFILL" = "true" ]; then
            pnpm collect:backfill
          else
            pnpm collect
          fi
      - run: pnpm verify
      - name: Commit validated data
        run: |
          git config user.name 'radar-collector[bot]'
          git config user.email 'radar-collector[bot]@users.noreply.github.com'
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m 'data: collect and verify source observations'
            git push
          fi
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: collection-diagnostics
          path: |
            data/review.json
            data/collection-log.json
            data/backfill-log.json
            test-results/
  deploy:
    needs: collect
    uses: ./.github/workflows/deploy.yml
