name: Collect verified evidence
on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: evidence-collection
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm collect
      - run: pnpm verify
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Commit validated data
        run: |
          git config user.name 'radar-collector[bot]'
          git config user.email 'radar-collector[bot]@users.noreply.github.com'
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m 'data: collect and verify source observations'
            git push
          fi
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: collection-diagnostics
          path: |
            data/review.json
            data/collection-log.json
            test-results/
  deploy:
    needs: collect
    uses: ./.github/workflows/deploy.yml
